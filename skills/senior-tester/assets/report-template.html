<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="senior-tester">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --sunk:#f1efea; --ink:#1c1b19; --muted:#66625b; --line:#e2ded6;
  --crit:#b3261e; --high:#c4541a; --med:#946f00; --low:#2f6d93; --info:#6f6b64;
  --ok:#2c7346; --bad:#b3261e;
  --crit-bg:#fbe9e7; --high-bg:#fcede2; --med-bg:#f8f0d6; --low-bg:#e5eff6; --info-bg:#efede9; --ok-bg:#e4f2e8;
  --sans:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141412; --surface:#1d1c19; --sunk:#181715; --ink:#ecebe6; --muted:#a29e96; --line:#33312c;
    --crit:#ff8a7f; --high:#ffaa6e; --med:#e5c25a; --low:#8cc0e2; --info:#aeaaa2;
    --ok:#7ccf96; --bad:#ff8a7f;
    --crit-bg:#3a1d1a; --high-bg:#3a271a; --med-bg:#342d17; --low-bg:#1b2a35; --info-bg:#292824; --ok-bg:#1b3023;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1d1c19; --sunk:#181715; --ink:#ecebe6; --muted:#a29e96; --line:#33312c;
  --crit:#ff8a7f; --high:#ffaa6e; --med:#e5c25a; --low:#8cc0e2; --info:#aeaaa2;
  --ok:#7ccf96; --bad:#ff8a7f;
  --crit-bg:#3a1d1a; --high-bg:#3a271a; --med-bg:#342d17; --low-bg:#1b2a35; --info-bg:#292824; --ok-bg:#1b3023;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:36px 16px 80px}
header.top{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:22px;margin-bottom:8px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:6px 0 8px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta code{font-family:var(--mono);font-size:13px}
.verdict{margin-top:14px;display:inline-block;padding:6px 12px;border-radius:6px;font-size:15px}
.verdict-block{background:var(--crit-bg);color:var(--crit)}
.verdict-risky{background:var(--med-bg);color:var(--med)}
.verdict-ok{background:var(--ok-bg);color:var(--ok)}
.grade{text-align:center;min-width:140px}
.grade .letter{font-size:84px;font-weight:700;line-height:1;letter-spacing:-.03em}
.grade .num{font-family:var(--mono);color:var(--muted);font-size:14px}
.grade .cap{font-size:12px;color:var(--bad);margin-top:6px;max-width:190px;margin-inline:auto}
section{margin-top:44px}
h2{font-size:21px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
h2 .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.summary{font-size:18px;margin:0}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.sev-Critical{color:var(--crit);background:var(--crit-bg)}
.sev-High{color:var(--high);background:var(--high-bg)}
.sev-Medium{color:var(--med);background:var(--med-bg)}
.sev-Low{color:var(--low);background:var(--low-bg)}
.sev-Info{color:var(--info);background:var(--info-bg)}
ol.prio{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:8px}
ol.prio li{counter-increment:p;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
ol.prio li::before{content:counter(p);font-family:var(--mono);font-weight:600;font-size:18px;color:var(--muted)}
ol.prio a{text-decoration:none;font-weight:600}
ol.prio a:hover{text-decoration:underline}
.scores{display:grid;gap:16px}
.score-row{display:grid;grid-template-columns:220px 1fr 78px;gap:14px;align-items:center}
.score-row .label{font-weight:600}
.score-row .w{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.score-row .why{grid-column:2 / 4;color:var(--muted);font-size:14px;margin-top:-10px}
.bar{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%}
.score-num{font-family:var(--mono);text-align:right;white-space:nowrap}
.delta{font-family:var(--mono);font-size:12px;margin-left:4px}
.up{color:var(--ok)} .down{color:var(--bad)}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:14px}
.filters,.actions{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:14px;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--low);outline-offset:2px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.finding{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;margin-bottom:10px;scroll-margin-top:16px}
details.finding[data-sev="Critical"]{border-left-color:var(--crit)}
details.finding[data-sev="High"]{border-left-color:var(--high)}
details.finding[data-sev="Medium"]{border-left-color:var(--med)}
details.finding[data-sev="Low"]{border-left-color:var(--low)}
details.finding:target{box-shadow:0 0 0 2px var(--low)}
details.finding summary{list-style:none;cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center}
details.finding summary::-webkit-details-marker{display:none}
.fid{font-family:var(--mono);font-size:13px;color:var(--muted)}
.ftitle{font-weight:600}
.fbody{padding:0 18px 18px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:14px 0 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fixp{margin:0 0 8px}
code,pre{font-family:var(--mono);font-size:13px}
pre{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;margin:0}
ol.steps{margin:0;padding-left:20px}
.shot{display:block;margin-top:14px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px}
.tag{display:inline-block;font-size:12px;font-family:var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:0 6px 0 0;font-weight:400}
.ftitle .tag{margin-left:8px}
.tag.suspected{color:var(--med);border-color:var(--med)}
.tag.imp-High{color:var(--ok);border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto;padding:6px 10px}
.st{font-size:13px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-pass,.st-success{color:var(--ok);background:var(--ok-bg)}
.st-fail,.st-failed,.st-stuck{color:var(--bad);background:var(--crit-bg)}
.st-struggled{color:var(--med);background:var(--med-bg)}
.st-na,.st-unchecked{color:var(--muted);background:var(--info-bg)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.idea h3{margin:0 0 6px;font-size:17px;line-height:1.35}
.idea p{margin:0 0 12px;color:var(--muted);font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cmp .card b{font-size:30px;display:block;line-height:1.1}
.empty{color:var(--muted);font-style:italic}
footer{margin-top:64px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:680px){
  header.top{grid-template-columns:1fr}
  .grade{text-align:left;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  .grade .letter{font-size:64px}
  .grade .cap{margin:0}
  .score-row{grid-template-columns:1fr auto}
  .score-row .bar{grid-column:1 / 3;grid-row:2}
  .score-row .why{grid-column:1 / 3;margin-top:-8px}
  details.finding summary{grid-template-columns:1fr auto}
  details.finding summary .fid{grid-column:1 / 3}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dt{margin-top:10px}
  .cmp{grid-template-columns:1fr}
  ol.prio li{grid-template-columns:auto 1fr}
  ol.prio li .pill{grid-column:2;justify-self:start}
}
@media print{
  body{background:#fff;font-size:12px}
  .wrap{padding:0;max-width:none}
  .toolbar{display:none}
  details.finding{break-inside:avoid}
  details.finding > summary ~ *{display:block !important}
  .card,details.finding,ol.prio li{border-color:#ccc}
  section{margin-top:28px}
}
</style>
</head>
<body>
<main class="wrap">
{{BODY}}
</main>
<script>
(function(){
  var btns=document.querySelectorAll('.filters button');
  var items=document.querySelectorAll('details.finding');
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      btns.forEach(function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed','true');
      var f=b.getAttribute('data-filter');
      items.forEach(function(it){
        var show=f==='all'||it.getAttribute('data-sev')===f||it.getAttribute('data-area')===f;
        it.style.display=show?'':'none';
      });
    });
  });
  var ex=document.getElementById('expand');
  if(ex){ex.addEventListener('click',function(){
    var anyClosed=Array.prototype.some.call(items,function(i){return !i.open});
    items.forEach(function(i){i.open=anyClosed});
  });}
  function openHash(){
    var id=decodeURIComponent(location.hash.slice(1));
    var el=id&&document.getElementById(id);
    if(el&&el.tagName==='DETAILS'){el.open=true;el.style.display='';}
  }
  window.addEventListener('hashchange',openHash);openHash();
  window.addEventListener('beforeprint',function(){items.forEach(function(i){i.open=true;i.style.display=''})});
})();
</script>
</body>
</html>
