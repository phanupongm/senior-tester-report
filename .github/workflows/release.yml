name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill for Claude.ai upload
        run: |
          cd skills
          zip -r ../senior-tester-skill.zip senior-tester -x '*/__pycache__/*'
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" senior-tester-skill.zip \
            --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
